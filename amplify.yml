version: 1
backend:
  phases:
    build:
      commands:
        - "npm ci --cache .npm --prefer-offline"
        - "export AWS_ACCOUNT_ID=438347844807"
        - export AMPLIFY_API_ID_DEFAULT=jn5enb4mo5fxffsxx67w4e6cr4
        - export AMPLIFY_TYPING_STATUS_TABLE_NAME="TypingStatus-${AMPLIFY_API_ID_DEFAULT}-NONE"
        - export AMPLIFY_USER_PROFILE_TABLE_NAME="UserProfile-dev"
        - export AMPLIFY_STORAGE_BUCKET_NAME="amplify-d25p7fqcjyrjps-de-userimagesdevelopbucket4-isxiwlnk4dgg"
        - export AMPLIFY_EVERYONE_ROLE_ARN="arn:aws:iam::438347844807:role/amplify-d25p7fqcjyrjps-de-amplifyAuthEVERYONEdevelo-KmIrnJCXlqK6"
        - export AMPLIFY_CHAT_MESSAGE_TABLE_NAME="ChatMessage-${AMPLIFY_API_ID_DEFAULT}-NONE"
        - export AMPLIFY_CONVERSATION_TABLE_NAME="Conversation-${AMPLIFY_API_ID_DEFAULT}-NONE"
        - export AMPLIFY_GRAPHQL_API_ID="${AMPLIFY_API_ID_DEFAULT}"
        - export AMPLIFY_MESSAGE_REACTION_TABLE_NAME="MessageReaction-${AMPLIFY_API_ID_DEFAULT}-NONE"
        - >
          if [[ "$AWS_BRANCH" == "main" ]]; then
            export AMPLIFY_TYPING_STATUS_TABLE_NAME="";
            export AMPLIFY_USER_PROFILE_TABLE_NAME="UserProfile-prod";
            export AMPLIFY_STORAGE_BUCKET_NAME="amplify-dkrmsanbniimt-main-userimagesmainbucket4-xyz123abc";
            export AMPLIFY_EVERYONE_ROLE_ARN="arn:aws:iam::438347844807:role/amplify-<your-main-role-name>";
            export AMPLIFY_CHAT_MESSAGE_TABLE_NAME="";
            export AMPLIFY_CONVERSATION_TABLE_NAME="";
            export AMPLIFY_GRAPHQL_API_ID="PUT-YOUR-MAIN-ID-HERE";
            export AMPLIFY_MESSAGE_REACTION_TABLE_NAME="";
          fi
        - "echo 'Using AMPLIFY_GRAPHQL_API_ID: $AMPLIFY_GRAPHQL_API_ID'"
        - "npx ampx pipeline-deploy --branch \"$AWS_BRANCH\" --app-id \"$AWS_APP_ID\""
frontend:
  phases:
    preBuild:
      commands:
        - "npx ng version"
    build:
      commands:
        - "npx ng build --configuration=production"
  artifacts:
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*