<div class="login">
  <amplify-authenticator [signUpAttributes]="signUpAttributes">
    <ng-template
      amplifySlot="authenticated"
      let-user="user"
      let-signOut="signOut"
    >
      <button (click)="handleSignOut(signOut)">Sign Out</button>
    </ng-template>
  </amplify-authenticator>
</div>
