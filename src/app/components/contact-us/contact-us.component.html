<main class="contact-container">
  <section class="form-section">
    <mat-card class="contact-card">
      <mat-card-title>Contact Us</mat-card-title>

      <form
        [formGroup]="contactForm"
        (ngSubmit)="onSubmit()"
        *ngIf="!success"
        class="contact-form"
      >
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input
            matInput
            formControlName="name"
            [class.invalid]="submitted && contactForm.get('name')?.invalid"
          />
          <mat-error *ngIf="submitted && contactForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            [class.invalid]="submitted && contactForm.get('email')?.invalid"
          />
          <mat-error *ngIf="submitted && contactForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="submitted && contactForm.get('email')?.hasError('email')">
            Enter a valid email
          </mat-error>
        </mat-form-field>

        <mat-form-field>
          <mat-label>Your message</mat-label>
          <textarea
            matInput
            rows="5"
            formControlName="summary"
            [class.invalid]="submitted && contactForm.get('summary')?.invalid"
          ></textarea>
          <mat-error *ngIf="submitted && contactForm.get('summary')?.hasError('required')">
            Message is required
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="submit-btn"
          type="submit"
        >
          Send
        </button>

        <mat-card class="alert alert-danger" *ngIf="error">
          {{ error }}
        </mat-card>
      </form>

      <mat-card class="alert alert-success" *ngIf="success">
        Thank you for your message! We will get back to you soon.
      </mat-card>
    </mat-card>
  </section>

  <section class="image-section">
    <img
      src="/assets/images/contact-us.png"
      alt="Contact Illustration"
      class="contact-image"
    />
  </section>
</main>
