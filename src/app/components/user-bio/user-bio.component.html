<main class="user-bio-container" *ngIf="profile$ | async as profile">
  <div class="bio-layout">
    <!-- LEFT COLUMN: USER INFO -->
    <section class="bio-info">
      <div class="about-section">
        <h3 class="label">About</h3>
        <h1 class="username">{{ profile.userName || 'User' }}</h1>
        <div class="meta">
          <span *ngIf="profile.age">{{ profile.age }}</span>
          <span *ngIf="profile.city"> | {{ profile.city }}</span>
        </div>
        <p class="description">
          {{ getBioFromSurvey(profile.surveyAnswers) }}
        </p>
      </div>

      <div class="likes-section" *ngIf="getLikesFromSurvey(profile.surveyAnswers).length">
        <h3 class="label">Likes</h3>
        <ul class="likes-list">
          <li *ngFor="let like of getLikesFromSurvey(profile.surveyAnswers)">
            - {{ like }}
          </li>
        </ul>
      </div>

      <div class="info-footer">
        <p class="distance">
          Distance: {{ profile.distance < 5 ? 'Less than 5 miles' : profile.distance + ' miles' }}
        </p>
        <p class="timestamp">
          Last Updated: {{ profile.lastUpdated | date:'short' }}
        </p>
        <button mat-raised-button color="primary" class="message-button"
          [routerLink]="['/chat', conversationId, identityId]">
          <mat-icon>chat</mat-icon> Message {{ profile.userName }}
        </button>
      </div>
    </section>

    <!-- RIGHT COLUMN: IMAGE -->
    <section class="bio-image">
      <app-image-display [identityId]="identityId"></app-image-display>
    </section>
  </div>
</main>
