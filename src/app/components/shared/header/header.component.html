<header class="main-header">
  <div class="header-inner">
    <!-- Branding -->
    <div class="branding">
      <a routerLink="/" class="brand-link">
        <img id="logo" src="/assets/images/logo.svg" alt="Get Local Logo" />
        <span id="logoText">Get Local</span>
      </a>
    </div>

    <!-- Desktop Navigation -->
    <nav class="nav-links desktop-nav">
      <a routerLink="/search" routerLinkActive="active" aria-label="Search">
        <mat-icon>search</mat-icon>
        <span>Search</span>
      </a>
      <a routerLink="/survey" routerLinkActive="active" aria-label="Survey">
        <mat-icon>assignment</mat-icon>
        <span>Survey</span>
      </a>
      <a routerLink="/chatList" routerLinkActive="active" class="messages-link" aria-label="Messages">
        <mat-icon>forum</mat-icon>
        <span>Messages</span>
        <span class="unread-badge" *ngIf="(unreadCount$ | async)">{{ unreadCount$ | async }}</span>
      </a>
      <a routerLink="/myProfile" routerLinkActive="active" aria-label="My Profile">
        <mat-icon>person</mat-icon>
        <span>My Profile</span>
      </a>
      <a class="signOut" (click)="signOut()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </a>
      <button class="theme-toggle-btn" (click)="toggleTheme()" aria-label="Toggle Theme">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </nav>

    <!-- Mobile Hamburger -->
    <button class="mobile-menu-btn" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Open Menu">
      <mat-icon>{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>

  <!-- Mobile Navigation Drawer -->
  <nav class="nav-links mobile-nav" *ngIf="mobileMenuOpen">
    <a routerLink="/search" routerLinkActive="active" (click)="mobileMenuOpen = false"><mat-icon>search</mat-icon>Search</a>
    <a routerLink="/survey" routerLinkActive="active" (click)="mobileMenuOpen = false"><mat-icon>assignment</mat-icon>Survey</a>
    <a routerLink="/chatList" routerLinkActive="active" (click)="mobileMenuOpen = false"><mat-icon>forum</mat-icon>Messages <span class="unread-badge" *ngIf="(unreadCount$ | async)">{{ unreadCount$ | async }}</span></a>
    <a routerLink="/myProfile" routerLinkActive="active" (click)="mobileMenuOpen = false"><mat-icon>person</mat-icon>My Profile</a>
    <a class="signOut" (click)="signOut(); mobileMenuOpen = false"><mat-icon>logout</mat-icon>Logout</a>
    <button class="theme-toggle-btn" (click)="toggleTheme()" aria-label="Toggle Theme">
      <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span>Theme</span>
    </button>
  </nav>
</header>
