<header>
  <div class="header-container">
    <div class="branding">
      <a routerLink="/">
        <img id="logo" src='/assets/images/logo.svg' />
        <span id="logoText">Get Local</span>
      </a>
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" />
    <label for="menu-toggle" class="menu-icon">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="nav-links">
    
      <ng-container *ngIf="(isLoggedIn$ | async); else loggedOut">
        <a routerLink="/dashboard" routerLinkActive="active"><mat-icon>dashboard</mat-icon>Dashboard</a>
        <a routerLink="/search" routerLinkActive="active"><mat-icon class="jiggle-icon">search</mat-icon>Search</a>
        <a routerLink="/chatList" routerLinkActive="active" class="messages-link">
            <div class="icon-wrapper">
              <mat-icon class="jiggle-icon">forum</mat-icon>
              <span class="unread-badge" *ngIf="(unreadCount$ | async)">
                {{ unreadCount$ | async }}
              </span>
            </div>
            <span class="messages-text">Messages</span>
          </a>
        
        <!-- Profile dropdown (desktop hover, mobile integrated) -->
        <div class="profile-container">
          <mat-icon>person</mat-icon>
          <div class="profile-dropdown">
            <div>
              <a routerLink="/myProfile">My Profile</a>
            </div>
            <div>
              <a class="signOut" (click)="signOut()"><mat-icon>logout</mat-icon>Logout</a>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-template #loggedOut>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
        <a routerLink="/survey" routerLinkActive="active"><mat-icon class="jiggle-icon">assignment</mat-icon>Survey</a>
        <a routerLink="/contact-us" routerLinkActive="active"><mat-icon class="jiggle-icon">mail</mat-icon>Contact Us</a>
        <a routerLink="/login" routerLinkActive="active"><mat-icon class="jiggle-icon">login</mat-icon>Sign Up</a>
        <!-- <a routerLink="/login" routerLinkActive="active">Login</a> -->
      </ng-template>

      <div class="theme-toggle" (click)="toggleTheme()">
        <mat-icon class="jiggle-icon">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </div>
    </nav>
  </div>
</header>
