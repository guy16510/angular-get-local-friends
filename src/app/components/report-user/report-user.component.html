<h2 mat-dialog-title class="text-center">Report User</h2>

<mat-dialog-content>
  <p class="mb-4">You are reporting <strong>{{ data.userName }}</strong> for inappropriate behavior in this conversation.</p>
  
  <form [formGroup]="reportForm" class="flex flex-col gap-4">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Reason for reporting</mat-label>
      <mat-select formControlName="reason" required>
        <mat-option value="harassment">Harassment</mat-option>
        <mat-option value="spam">Spam</mat-option>
        <mat-option value="inappropriate_content">Inappropriate Content</mat-option>
        <mat-option value="other">Other</mat-option>
      </mat-select>
      <mat-error *ngIf="reportForm.get('reason')?.hasError('required')">
        Please select a reason
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Additional details (optional)</mat-label>
      <textarea matInput formControlName="details" rows="4" placeholder="Please provide any additional details about the reported behavior..."></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="flex gap-2">
  <button mat-button mat-dialog-close [disabled]="isSubmitting">Cancel</button>
  <button mat-raised-button color="accent" (click)="submitReport()" [disabled]="!reportForm.valid || isSubmitting">
    <span *ngIf="!isSubmitting">Submit Report</span>
    <span *ngIf="isSubmitting">Submitting...</span>
  </button>
</mat-dialog-actions>
