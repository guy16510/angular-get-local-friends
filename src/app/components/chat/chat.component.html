<div class="chat-container">
  <!-- Chat Header -->
  <div class="chat-header">
    <button mat-icon-button>
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="recipient-name">{{ recipientId }}</span>
  </div>

  <!-- Messages List -->
  <div class="chat-messages" *ngIf="messages$ | async as messages">
    <!-- <div *ngFor="let msg of messages" class="chat-message" [ngClass]="{'mine': msg.senderId === currentUserId, 'theirs': msg.senderId !== currentUserId}"> -->
      <div *ngFor="let msg of messages$ | async" class="chat-message">
        <mat-card class="message-bubble">
        <div class="text">{{ msg.text }}</div>
        <div class="timestamp">{{ msg.timestamp | date: 'shortTime' }}</div>
      </mat-card>
    </div>
  </div>

  <!-- Message Input -->
  <div class="chat-input">
    <mat-form-field class="message-field">
      <input matInput [(ngModel)]="newMessageText" placeholder="Type a message..." (keydown.enter)="sendMessage()" />
    </mat-form-field>
    <button mat-icon-button color="primary" (click)="sendMessage()" [disabled]="!newMessageText.trim()">
      <mat-icon>send</mat-icon>
    </button>
  </div>
</div>
