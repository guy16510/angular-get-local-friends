<div class="chat-container">
  <!-- Loading indicator at the top -->
  <div class="loading-indicator" *ngIf="loading$ | async">
    <app-loading></app-loading>
  </div>

  <!-- Messages area: shown only when not loading -->
  <div class="chat-messages" #messagesContainer *ngIf="!(loading$ | async)">
    <!-- Error message -->
    <ng-container *ngIf="error$ | async as error">
      <div class="error-message">Error: {{ error }}</div>
    </ng-container>
    <!-- Message list -->
    <div *ngFor="let msg of messages$ | async" class="message-wrapper" [ngClass]="{
      'mine': msg.senderId === currentUserId,
      'theirs': msg.senderId !== currentUserId
    }">
      <app-image-display
        *ngIf="msg.senderId !== currentUserId"
        [identityId]="msg.senderId"
        class="avatar left-avatar">
      </app-image-display>

      <mat-card class="message-bubble">
        <div class="text">{{ msg.text }}</div>
        <div class="timestamp">{{ msg.timestamp | date: 'shortTime' }}</div>
      </mat-card>

      <app-image-display
        *ngIf="msg.senderId === currentUserId"
        [identityId]="msg.senderId"
        class="avatar right-avatar">
      </app-image-display>
    </div>
  </div>

  <div class="typing-area" *ngIf="isOtherUserTyping">
    <!-- Display the other user's avatar (assumes otherUserId is defined in your component) -->
    <app-image-display [identityId]="recipientId" class="avatar typing-avatar"></app-image-display>
    <!-- Animated typing indicator next to the avatar -->
    <div class="typing-indicator-content">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Message input -->
  <div class="chat-input">
    <!-- <div class="typing-indicator" *ngIf="isOtherUserTyping"> -->
      <!-- <div class="typing-indicator" *ngIf="true">
        <div class="dots">
          <span></span><span></span><span></span>
        </div>
    </div> -->
    <mat-form-field class="message-field">
      <input
        matInput
        [(ngModel)]="newMessageText"
        placeholder="Type a message..."
        (keydown.enter)="sendMessage()" 
        (input)="onInputChange()"
        (blur)="onInputBlur()"
        />
    </mat-form-field>
    <button mat-icon-button color="primary" (click)="sendMessage()" [disabled]="!newMessageText.trim()">
      <mat-icon>send</mat-icon>
    </button>
  </div>
</div>
