<main class="search-container">
  <mat-card class="search-card">
    <mat-card-title>Find Friends Nearby</mat-card-title>
    <mat-card-content>
      <div class="search-controls">
        <span class="location-info">Search near: <strong>{{city}}</strong></span>
        <mat-form-field class="radius-field" appearance="outline">
          <mat-label>Radius</mat-label>
          <mat-select [(ngModel)]="radius" name="radius">
            <mat-option *ngFor="let option of radiusOptions" [value]="option">{{ option }} mi</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-raised-button color="accent" (click)="usePreciseLocation()">Precise Location</button>
        <button mat-raised-button color="primary" (click)="searchUsers()" [disabled]="loading$ | async">Search</button>
      </div>
    </mat-card-content>
  </mat-card>

  <app-loading *ngIf="loading$ | async"></app-loading>

  <ng-container *ngIf="(nearbyUsers$ | async) as users">
    <mat-card *ngIf="users.length > 0">
      <mat-card-content>
        <mat-grid-list cols="3" rowHeight="1:1.2" gutterSize="12px">
          <mat-grid-tile *ngFor="let user of users">
            <mat-card class="user-card" [routerLink]="['/user-bio', user.identityId]">
              <app-image-display [identityId]="user.identityId"></app-image-display>
              <span class="online-dot" *ngIf="isOnline(user.lastOnlineAt)"></span>
              <span *ngIf="!isOnline(user.lastOnlineAt)">Last seen {{ user.lastOnlineAt | date:'short' }}</span>
              <mat-card-content>
                <p>{{ user.userName }}</p>
                <p>{{ user.distance }}</p>
              </mat-card-content>
            </mat-card>
          </mat-grid-tile>
        </mat-grid-list>

        <div class="navigation-buttons">
          <button mat-stroked-button
                  (click)="previousPage()"
                  [disabled]="currentPage === 0"
                  [ngClass]="{ 'disabled-btn': currentPage === 0 }">
            Previous
          </button>
          <button mat-stroked-button
                  (click)="nextPage()"
                  [disabled]="!hasMoreResults"
                  [ngClass]="{ 'disabled-btn': !hasMoreResults }">
            Next
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </ng-container>
</main>
