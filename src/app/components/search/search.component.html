<main class="search-container">
  <mat-card class="search-card">
    <mat-card-title>Find Friends Nearby</mat-card-title>
    <mat-card-content>
      <div class="form-row">
        <mat-form-field class="form-field" appearance="outline">
          <mat-label>Latitude</mat-label>
          <input matInput [(ngModel)]="lat" name="lat">
        </mat-form-field>

        <mat-form-field class="form-field" appearance="outline">
          <mat-label>Longitude</mat-label>
          <input matInput [(ngModel)]="lng" name="lng">
        </mat-form-field>

        <mat-form-field class="form-field" appearance="outline">
          <mat-label>Radius</mat-label>
          <mat-select [(ngModel)]="radius" name="radius">
            <mat-option *ngFor="let r of radiusOptions" [value]="r">{{ r }} miles</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="buttons-row">
        <button mat-stroked-button type="button" (click)="usePreciseLocation()">Use Precise Location</button>
        <button mat-raised-button color="primary" (click)="searchUsers()" [disabled]="loading$ | async">
          Search
        </button>
      </div>

      <app-loading *ngIf="loading$ | async" mode="indeterminate"></app-loading>

      <div class="error" *ngIf="error$ | async as error">{{ error }}</div>
    </mat-card-content>
  </mat-card>

  <mat-grid-list cols="3" gutterSize="12px" rowHeight="350px" *ngIf="(nearbyUsers$ | async)?.length">
    <mat-grid-tile *ngFor="let user of nearbyUsers$ | async">
      <mat-card class="user-card">
        <app-image-display [identityId]="user.identityId"></app-image-display>
        <mat-card-content>
          <p>{{ user.userName || 'User' }}</p>
          <p>{{ user.distance | number:'1.2-2' }} miles away</p>
          <small>{{ user.lastUpdated | date:'short' }}</small>
        </mat-card-content>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>

  <div class="pagination-controls">
    <button mat-stroked-button (click)="previousPage()" [disabled]="currentPage === 0">
      Previous
    </button>
    <button mat-stroked-button (click)="nextPage()" [disabled]="!(paginationTokens[currentPage + 1])">
      Next
    </button>
  </div>
</main>
