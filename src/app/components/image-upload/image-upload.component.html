<div class="upload-container">
  <!-- Hidden file input to be triggered by the pencil icon -->
  <input #fileInput type="file" (change)="onFileChange($event)" accept="image/*" hidden />
  <!-- You can keep this button for manual testing if needed -->
  <button mat-raised-button color="primary" (click)="upload()" [disabled]="!selectedFile">
    Upload
  </button>
</div>
